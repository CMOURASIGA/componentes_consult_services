<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RT-018 | Abas para formulários</title><link rel="stylesheet" href="../componentes/consult-tabs.css"><style>body{margin:0;background:#f4f7fa;font:14px system-ui,Arial,sans-serif;color:#24364d}.page{max-width:1100px;margin:32px auto;padding:0 18px}.page h1{font-size:24px;margin-bottom:4px}.page p{color:#627489}.demo-toolbar{display:flex;gap:10px;align-items:center;margin:18px 0}.demo-toolbar button{padding:8px 12px;border:1px solid #c8d4e5;border-radius:5px;background:white;cursor:pointer}.loading-sample{display:none}.is-loading .loading-sample{display:block}.is-loading .form-sample{display:none}.loading-sample .cs-tabs__grid{margin-top:20px}.loading-sample .cs-tabs__skeleton--large{grid-column:1/-1}.info{margin-top:14px;color:#566d84;font-size:12px}</style></head><body><main class="page"><h1>RT-018 · Abas contextuais para formulários</h1><p>Exemplo visual com a estrutura do segundo anexo e estado de carregamento do primeiro anexo.</p><div class="demo-toolbar"><button type="button" id="toggle-loading">Simular carregamento</button><span id="status" role="status" aria-live="polite"></span></div>
<div class="loading-sample cs-tabs" aria-hidden="true"><div class="cs-tabs__nav"><div class="cs-tabs__skeleton" style="width:110px"></div><div class="cs-tabs__skeleton" style="width:140px"></div><div class="cs-tabs__skeleton" style="width:105px"></div></div><div class="cs-tabs__panel"><div class="cs-tabs__grid"><div class="cs-tabs__field"><div class="cs-tabs__skeleton cs-tabs__skeleton--label"></div><div class="cs-tabs__skeleton"></div></div><div class="cs-tabs__field"><div class="cs-tabs__skeleton cs-tabs__skeleton--label"></div><div class="cs-tabs__skeleton"></div></div><div class="cs-tabs__field cs-tabs__field--third"><div class="cs-tabs__skeleton"></div></div><div class="cs-tabs__field cs-tabs__field--third"><div class="cs-tabs__skeleton"></div></div><div class="cs-tabs__field cs-tabs__field--third"><div class="cs-tabs__skeleton"></div></div><div class="cs-tabs__skeleton cs-tabs__skeleton--large"></div></div></div></div>
<form id="event-form" class="form-sample cs-tabs" data-consult-tabs>
<div class="cs-tabs__nav" role="tablist" aria-label="Seções do evento"><button class="cs-tabs__tab" type="button" role="tab" id="event-tab-general" aria-controls="event-panel-general" aria-selected="true">Informações Gerais</button><button class="cs-tabs__tab" type="button" role="tab" id="event-tab-planning" aria-controls="event-panel-planning" aria-selected="false" tabindex="-1">Detalhes &amp; Planejamento</button><button class="cs-tabs__tab" type="button" role="tab" id="event-tab-booking" aria-controls="event-panel-booking" aria-selected="false" tabindex="-1">Reservas</button><button class="cs-tabs__tab" type="button" role="tab" id="event-tab-complexity" aria-controls="event-panel-complexity" aria-selected="false" tabindex="-1">Complexidade</button></div>
<section class="cs-tabs__panel" id="event-panel-general" role="tabpanel" aria-labelledby="event-tab-general"><div class="cs-tabs__grid"><div class="cs-tabs__field"><label for="title">Título do Evento *</label><input id="title" name="title" required placeholder="Informe o título"></div><div class="cs-tabs__field"><label for="theme">Temática</label><select id="theme" name="theme"><option value="">Selecione as temáticas...</option><option>Educação</option><option>Tecnologia</option><option>Gestão</option></select></div><div class="cs-tabs__field"><label for="start">Início *</label><input type="datetime-local" id="start" name="start" required></div><div class="cs-tabs__field"><label for="end">Fim *</label><input type="datetime-local" id="end" name="end" required></div><div class="cs-tabs__field cs-tabs__field--third"><label for="duration">Duração (h)</label><input id="duration" name="duration" type="number" min="0" step=".5" placeholder="0"></div><div class="cs-tabs__field cs-tabs__field--third"><label for="frequency">Frequência</label><select id="frequency" name="frequency"><option value="">Selecione uma opção</option><option>Única</option><option>Semanal</option><option>Mensal</option></select></div><div class="cs-tabs__field cs-tabs__field--third"><label for="situation">Situação *</label><select id="situation" name="situation" required><option value="">Selecione uma opção</option><option>Planejado</option><option>Em andamento</option><option>Concluído</option></select></div></div></section>
<section class="cs-tabs__panel" id="event-panel-planning" role="tabpanel" aria-labelledby="event-tab-planning" hidden><div class="cs-tabs__grid"><div class="cs-tabs__field cs-tabs__field--full"><label for="description">Descrição e planejamento</label><textarea id="description" name="description" placeholder="Descreva objetivos, atividades e entregas"></textarea></div><div class="cs-tabs__field"><label for="owner">Responsável</label><input id="owner" name="owner"></div><div class="cs-tabs__field"><label for="due">Data de referência</label><input id="due" name="due" type="date"></div></div></section>
<section class="cs-tabs__panel" id="event-panel-booking" role="tabpanel" aria-labelledby="event-tab-booking" hidden><div class="cs-tabs__grid"><div class="cs-tabs__field"><label for="location">Local ou sala</label><input id="location" name="location"></div><div class="cs-tabs__field"><label for="capacity">Capacidade prevista</label><input id="capacity" name="capacity" type="number" min="0"></div><div class="cs-tabs__field cs-tabs__field--full"><label for="booking-notes">Observações da reserva</label><textarea id="booking-notes" name="booking-notes"></textarea></div></div></section>
<section class="cs-tabs__panel" id="event-panel-complexity" role="tabpanel" aria-labelledby="event-tab-complexity" hidden><div class="cs-tabs__grid"><div class="cs-tabs__field"><label for="complexity">Nível de complexidade</label><select id="complexity" name="complexity"><option value="">Selecione</option><option>Baixa</option><option>Média</option><option>Alta</option></select></div><div class="cs-tabs__field cs-tabs__field--full"><label for="reason">Justificativa</label><textarea id="reason" name="reason"></textarea></div></div></section>
<div class="cs-tabs__panel" style="padding-top:0"><div class="cs-tabs__actions"><button class="cs-tabs__action" type="reset">Limpar campos</button><button class="cs-tabs__action cs-tabs__action--primary" type="submit">Validar formulário</button></div></div></form><div class="info">Demonstração local: não grava informações nem envia dados a servidores. Use Tab, setas esquerda/direita, Home e End para navegar.</div></main>
<script src="../componentes/consult-tabs.js"></script><script>
const wrapper=document.querySelector('.page'),toggle=document.getElementById('toggle-loading'),status=document.getElementById('status'),form=document.getElementById('event-form');
toggle.addEventListener('click',()=>{const loading=wrapper.classList.toggle('is-loading');toggle.textContent=loading?'Exibir formulário':'Simular carregamento';status.textContent=loading?'Prévia do estado de carregamento':'Formulário pronto';form.inert=loading;});
form.addEventListener('submit',e=>{e.preventDefault();const invalid=Array.from(form.querySelectorAll(':invalid'))[0];if(invalid){const panel=invalid.closest('[role="tabpanel"]');if(panel)form.querySelector('[aria-controls="'+panel.id+'"]').click();invalid.focus();status.textContent='Preencha os campos obrigatórios';return;}status.textContent='Formulário validado localmente. Nenhum dado foi enviado.';});
form.addEventListener('invalid',e=>{const panel=e.target.closest('[role="tabpanel"]');if(panel){form.query('[aria-controls="'+panel.id+'"]').click();}},true);
</script></body></html>
